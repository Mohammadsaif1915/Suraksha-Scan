<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to SurakshaScan — Scam Detection & Cyber Safety Platform">
    <title>SurakshaScan — Sign In</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <h2>Login to <span>SurakshaScan</span></h2>
        <div id="loginError" class="error-message" style="display: none;"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address <span style="color:var(--danger)">*</span></label>
                <input type="email" id="email" name="email" required placeholder="Enter your registered email">
            </div>
            <div class="form-group">
                <label for="password">Password <span style="color:var(--danger)">*</span></label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
                <a href="#" class="forgot-password" onclick="alert('Password reset link sent to your email!')">Forgot Password?</a>
            </div>
            <button type="submit" id="loginBtn">Sign In securely</button>
        </form>
        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
