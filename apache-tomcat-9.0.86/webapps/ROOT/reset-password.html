<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Reset Password — SurakshaScan">
    <title>SurakshaScan — Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy: #0C2340;
            --navy-2: #123258;
            --marigold: #F2A73B;
            --marigold-dark: #D98C1F;
            --paper: #F1ECDD;
            --surface: #FAF6EC;
            --ink: #16202E;
            --ink-soft: #5A6B7D;
            --line: #DFD6BE;
            --safe: #2E8B57;
            --danger: #D64545;
            --radius-s: 10px;
            --radius-m: 18px;
            --radius-l: 28px;
            --shadow: 0 24px 50px -22px rgba(12, 35, 64, 0.28);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --paper: #0B1622;
                --surface: #101E2E;
                --ink: #EDF1F5;
                --ink-soft: #9FB0C0;
                --line: #22314480;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--paper);
            color: var(--ink);
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            min-height: 100%;
        }

        h1, h2, .brand {
            font-family: 'Poppins', sans-serif;
        }

        a {
            color: inherit;
        }

        :focus-visible {
            outline: 3px solid var(--marigold);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* left brand panel */
        .brand-panel {
            position: relative;
            background: var(--navy);
            color: #EAF0F6;
            padding: 52px 56px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .brand-panel::before {
            content: '';
            position: absolute;
            top: -140px;
            right: -140px;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(242, 167, 59, .22), transparent 70%);
        }

        .brand-top {
            position: relative;
            z-index: 1;
        }

        .brand-top a {
            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            color: #fff;
        }

        .brand-top a em {
            font-style: normal;
            color: var(--marigold);
        }

        .brand-mid {
            position: relative;
            z-index: 1;
            max-width: 420px;
        }

        .brand-mid h1 {
            font-size: clamp(28px, 3vw, 36px);
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .brand-mid p {
            color: #B9C7D6;
            font-size: 15.5px;
            line-height: 1.6;
        }

        /* right form panel */
        .form-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-l);
            padding: 44px 38px;
            box-shadow: var(--shadow);
        }

        .auth-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--marigold), var(--marigold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 20px;
        }

        .auth-container h2 {
            font-size: 26px;
            color: var(--navy);
            margin-bottom: 6px;
        }

        @media (prefers-color-scheme:dark) {
            .auth-container h2 {
                color: var(--ink);
            }
        }

        .auth-sub {
            color: var(--ink-soft);
            font-size: 14.5px;
            margin-bottom: 28px;
        }

        .message-box {
            padding: 11px 14px;
            border-radius: var(--radius-s);
            font-size: 13.5px;
            margin-bottom: 20px;
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            opacity: .6;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px 13px 40px;
            border-radius: var(--radius-s);
            border: 1.5px solid var(--line);
            background: var(--paper);
            color: var(--ink);
            font-family: inherit;
            font-size: 14.5px;
            transition: border-color .2s, box-shadow .2s;
        }

        .form-group input:focus {
            border-color: var(--navy);
            outline: none;
            box-shadow: 0 0 0 4px rgba(12, 35, 64, .08);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 999px;
            background: var(--navy);
            color: #fff;
            font-weight: 700;
            font-size: 15.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background .2s, transform .18s, box-shadow .2s;
            margin-top: 6px;
        }

        .btn-submit:hover {
            background: var(--navy-2);
            transform: translateY(-2px);
            box-shadow: 0 12px 26px -10px rgba(12, 35, 64, .5);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--ink-soft);
            text-decoration: none;
        }
        
        .back-link:hover {
            color: var(--navy);
            text-decoration: underline;
        }

        @media (prefers-color-scheme:dark) {
            .back-link:hover {
                color: var(--marigold);
            }
        }

        @media (max-width:920px) {
            body {
                grid-template-columns: 1fr;
            }
            .brand-panel {
                display: none;
            }
            .form-panel {
                padding-top: 76px;
            }
        }
    </style>
</head>

<body>
    <section class="brand-panel">
        <div class="brand-top"><a href="index.html" style="display:flex; align-items:center; text-decoration:none;"><img src="img/logo.png" alt="Logo" style="height:1.2em; margin-right:8px; vertical-align:middle;">Suraksha<em>Scan</em></a></div>
        <div class="brand-mid">
            <h1>Secure your account</h1>
            <p>Please enter a strong new password to keep your account safe from unauthorized access.</p>
        </div>
    </section>

    <section class="form-panel">
        <div class="auth-container">
            <div class="auth-icon">✨</div>
            <h2>Set New Password</h2>
            <p class="auth-sub">Enter and confirm your new password.</p>

            <div id="msgBox" class="message-box"></div>

            <form id="resetForm" novalidate>
                <div class="form-group">
                    <label for="password">New Password <span style="color:var(--danger)">*</span></label>
                    <div class="input-wrap">
                        <span class="icon">🔒</span>
                        <input type="password" id="password" name="password" required placeholder="Enter new password">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirm Password <span style="color:var(--danger)">*</span></label>
                    <div class="input-wrap">
                        <span class="icon">🔒</span>
                        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm new password">
                    </div>
                </div>
                
                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">Update Password</span>
                </button>
            </form>
        </div>
    </section>

    <script>
        document.getElementById('resetForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            const msgBox = document.getElementById('msgBox');
            
            if (!pass || !confirm) {
                msgBox.textContent = 'Please fill in both fields.';
                msgBox.style.background = 'rgba(214, 69, 69, .1)';
                msgBox.style.border = '1px solid var(--danger)';
                msgBox.style.color = 'var(--danger)';
                msgBox.style.display = 'block';
                return;
            }
            
            if (pass !== confirm) {
                msgBox.textContent = 'Passwords do not match.';
                msgBox.style.background = 'rgba(214, 69, 69, .1)';
                msgBox.style.border = '1px solid var(--danger)';
                msgBox.style.color = 'var(--danger)';
                msgBox.style.display = 'block';
                return;
            }
            
            // Simulate API call to reset password
            const btn = document.getElementById('submitBtn');
            const btnText = btn.querySelector('.btn-text');
            btn.disabled = true;
            btnText.textContent = 'Updating...';
            
            setTimeout(() => {
                btn.disabled = false;
                btnText.textContent = 'Update Password';
                msgBox.textContent = 'Password has been successfully updated! (Demo: Redirecting to login...)';
                msgBox.style.background = 'rgba(46,139,87,.1)';
                msgBox.style.border = '1px solid var(--safe)';
                msgBox.style.color = 'var(--safe)';
                msgBox.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }, 1000);
        });
    </script>
</body>
</html>
