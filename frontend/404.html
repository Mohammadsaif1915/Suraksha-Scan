<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurakshaScan — Page Not Found</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: none; } /* global style handles body */
        .notfound-box { max-width: 480px; padding: 40px 30px; }
        .notfound-code { font-size: 96px; font-weight: 900; color: var(--primary); margin: 0; line-height: 1; }
        .notfound-title { font-size: 24px; color: var(--text); margin: 12px 0 8px; }
        .notfound-msg { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
        .notfound-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .notfound-icon { font-size: 48px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="notfound-box">
        <div class="notfound-icon">🔍</div>
        <div class="notfound-code">404</div>
        <h1 class="notfound-title">Page Not Found</h1>
        <p class="notfound-msg">The page you're looking for doesn't exist or has been moved.</p>
        <div class="notfound-actions">
            <a href="javascript:history.back()" class="btn btn-secondary">← Go Back</a>
            <a href="dashboard.html" class="btn btn-primary">Go to Dashboard</a>
            <a href="login.html" class="btn btn-secondary">Sign In</a>
        </div>
        <p style="margin-top: 32px; color: var(--muted); font-size: 13px;">SurakshaScan — Cyber Safety Platform</p>
    </div>
</body>
</html>
